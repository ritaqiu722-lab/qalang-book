<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>mnanak na qalang 繪本</title>
<style>
  :root{
    --bg:#140f0c; --ink:#f6ead6; --accent:#e9a23b; --red:#8c2a22;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;overflow:hidden}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  /* 4:3 舞台 */
  #stage{position:relative;aspect-ratio:4/3;
    width:min(100vw, calc((100vh - 56px) * 4/3));
    max-height:calc(100vh - 56px);
    background:#000;box-shadow:0 10px 40px #000a;overflow:hidden;touch-action:pan-y}
  #stage img.page{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    opacity:0;transition:opacity .45s ease}
  #stage img.page.on{opacity:1}
  /* 左右翻頁 */
  .nav{position:absolute;top:50%;transform:translateY(-50%);width:15%;height:60%;
    display:flex;align-items:center;justify-content:center;border:0;background:none;cursor:pointer;opacity:.0;transition:opacity .2s}
  #stage:hover .nav,.nav:focus-visible{opacity:1}
  .nav img{width:clamp(34px,6vw,64px);filter:drop-shadow(0 0 6px #000)}
  .nav img{box-sizing:content-box;padding:12px 10px;background:#140f0ccc;border-radius:999px;border:1px solid #e9a23b88}
  #prev{left:0}#next{right:0}
  .nav[disabled]{visibility:hidden}
  @media (hover:none){.nav{opacity:.8}}
  /* 底部工具列 */
  #bar{height:56px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 10px;
    background:linear-gradient(#1b1411,#140f0c);border-top:2px solid var(--red)}
  #bar button{font:inherit;color:var(--ink);background:#2a1f1a;border:1px solid #5a3a2c;border-radius:999px;
    padding:6px 12px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap}
  #bar button:hover{background:#3a2a22}
  #bar button[aria-pressed="false"]{opacity:.45}
  #bar button img{height:22px}
  #count{min-width:64px;text-align:center;font-variant-numeric:tabular-nums;color:#cbb89a;font-size:14px}
  #progress{position:absolute;left:0;right:0;bottom:0;height:5px;background:#0006}
  #progress i{display:block;height:100%;width:0;background:var(--accent)}
  /* 封面遮罩 */
  #intro{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    padding-bottom:7%;background:linear-gradient(transparent 45%,#000b);cursor:pointer;text-align:center}
  #intro .go{background:var(--accent);color:#2a1408;border:0;border-radius:999px;padding:12px 30px;font-size:clamp(16px,2.6vw,24px);font-weight:700;
    box-shadow:0 4px 18px #000a;animation:pulse 1.8s ease-in-out infinite}
  #intro small{margin-top:10px;color:#e9dcc3;font-size:clamp(11px,1.6vw,14px);text-shadow:0 1px 3px #000}
  #intro .spirit{position:absolute;left:4%;bottom:4%;width:14%;opacity:.0}
  @keyframes pulse{50%{transform:scale(1.06)}}
  #end{position:absolute;inset:0;z-index:4;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;
    background:#000a;text-align:center}
  #end.show{display:flex}
  #end img{width:min(34%,220px);filter:drop-shadow(0 0 12px #e9a23b66)}
  #end h2{margin:0;font-size:clamp(20px,4vw,34px)}
  #end button{background:var(--accent);color:#2a1408;border:0;border-radius:999px;padding:10px 26px;font:inherit;font-weight:700;cursor:pointer}
  @media (max-width:560px){#bar button span{display:none}#bar button{padding:6px 10px}}
</style>
</head>
<body>
<div id="app">
  <div id="stage" aria-live="polite">
    <button id="prev" class="nav" aria-label="上一頁"><img src="img/left.png" alt=""></button>
    <button id="next" class="nav" aria-label="下一頁"><img src="img/right.png" alt=""></button>
    <div id="intro" role="button" tabindex="0" aria-label="開始閱讀">
      <button class="go" type="button">點一下 開始閱讀</button>
      <small>會有旁白與音樂,請把音量打開</small>
    </div>
    <div id="end">
      <img src="img/spirit.png" alt="">
      <h2>故事結束了</h2>
      <button id="again" type="button">再讀一次</button>
    </div>
    <div id="progress"><i></i></div>
  </div>
  <div id="bar">
    <button id="btnVoice" aria-pressed="true" title="旁白"><img src="img/read.png" alt=""><span>旁白</span></button>
    <button id="btnMusic" aria-pressed="true" title="配樂">♪<span>配樂</span></button>
    <button id="btnAuto"  aria-pressed="false" title="朗讀完自動翻頁">⏭<span>自動翻頁</span></button>
    <button id="btnReplay" title="重聽這一頁">↻<span>重聽</span></button>
    <div id="count">1 / 20</div>
  </div>
</div>

<script>
/* ============ 設定 ============ */
const TOTAL = 20;                 // 頁數 (p0.jpg ~ p19.jpg)
const VOICE_VOL = 1.0;            // 旁白音量
const MUSIC_VOL = 0.28;           // 每頁配樂音量 (比旁白小聲)
const BGM_VOL   = 0.5;            // 封面主題曲音量
const BGM_ONLY_ON_COVER = true;   // true: 主題曲只在封面播放; false: 全書循環低音量播放
/* =============================== */

const $ = s => document.querySelector(s);
const stage = $('#stage');
let cur = 0, started = false;
let voiceOn = true, musicOn = true, autoOn = false;
try{ const s = JSON.parse(localStorage.getItem('qalang-prefs')||'{}');
  if('voiceOn' in s) voiceOn = s.voiceOn; if('musicOn' in s) musicOn = s.musicOn; if('autoOn' in s) autoOn = s.autoOn; }catch(e){}
const save = () => { try{ localStorage.setItem('qalang-prefs', JSON.stringify({voiceOn,musicOn,autoOn})) }catch(e){} };

// 圖片層
const imgs = [];
for(let i=0;i<TOTAL;i++){
  const im = new Image(); im.className='page'; im.alt='繪本第 '+(i+1)+' 頁'; im.decoding='async';
  im.src = `img/p${i}.jpg`; if(i>1) im.loading='lazy';
  stage.insertBefore(im, stage.firstChild); imgs[i]=im;
}

// 音訊
const voice = new Audio(), music = new Audio(), bgm = new Audio('audio/bgm.mp3');
music.loop = true; bgm.loop = true;
voice.volume = VOICE_VOL; music.volume = MUSIC_VOL; bgm.volume = BGM_VOL;
voice.preload = music.preload = 'auto';

function fade(a, to, ms=700){
  clearInterval(a._f); const from = a.volume, t0 = performance.now();
  a._f = setInterval(()=>{
    const k = Math.min(1,(performance.now()-t0)/ms);
    a.volume = Math.max(0,Math.min(1, from+(to-from)*k));
    if(k>=1){ clearInterval(a._f); if(to===0) a.pause(); }
  },40);
}
const play = a => a.play().catch(()=>{});

function setAudio(){
  // 旁白
  voice.pause(); voice.src = `audio/speech${cur}.mp3`; voice.currentTime = 0;
  if(voiceOn) play(voice);
  // 配樂
  const src = `audio/music${cur}.mp3`;
  if(!music.src.endsWith(src)){ music.src = src; }
  if(musicOn){ music.volume = 0; play(music); fade(music, MUSIC_VOL, 900); } else music.pause();
  // 主題曲
  if(cur===0 || !BGM_ONLY_ON_COVER){
    if(musicOn && bgm.paused){ bgm.volume = 0; play(bgm); fade(bgm, cur===0?BGM_VOL:0.12, 900); }
    else if(musicOn) fade(bgm, cur===0?BGM_VOL:0.12, 600);
  } else if(!bgm.paused) fade(bgm,0,800);
}

function show(n, dir){
  cur = Math.max(0, Math.min(TOTAL-1, n));
  imgs.forEach((im,i)=>im.classList.toggle('on', i===cur));
  $('#prev').disabled = cur===0; $('#next').disabled = false;
  $('#count').textContent = `${cur+1} / ${TOTAL}`;
  $('#progress i').style.width = ((cur+1)/TOTAL*100)+'%';
  $('#end').classList.remove('show');
  if(started) setAudio();
  // 預載下一頁
  [cur+1,cur+2].forEach(i=>{ if(i<TOTAL){ const a=new Audio(); a.preload='auto'; a.src=`audio/speech${i}.mp3`; }});
  history.replaceState(null,'','#'+(cur+1));
}
function next(){ if(cur<TOTAL-1) show(cur+1); else finish(); }
function prev(){ if(cur>0) show(cur-1); }
function finish(){
  voice.pause(); fade(music,0,1200); fade(bgm,0,1200);
  $('#end').classList.add('show');
}
function begin(){
  if(started) return; started = true;
  $('#intro').style.display='none';
  setAudio();
}

voice.addEventListener('ended', ()=>{ if(autoOn && started && voiceOn){ setTimeout(next, 900); } });

$('#prev').onclick = prev; $('#next').onclick = next;
$('#intro').onclick = begin;
$('#intro').onkeydown = e => { if(e.key==='Enter'||e.key===' ') begin(); };
$('#again').onclick = () => { show(0); };

function sync(){
  $('#btnVoice').setAttribute('aria-pressed', voiceOn);
  $('#btnMusic').setAttribute('aria-pressed', musicOn);
  $('#btnAuto').setAttribute('aria-pressed', autoOn);
}
$('#btnVoice').onclick = () => { voiceOn=!voiceOn; save(); sync(); if(!started) return; voiceOn? play(voice) : voice.pause(); };
$('#btnMusic').onclick = () => { musicOn=!musicOn; save(); sync(); if(!started) return;
  if(musicOn){ setAudio(); } else { music.pause(); bgm.pause(); } };
$('#btnAuto').onclick  = () => { autoOn=!autoOn; save(); sync(); };
$('#btnReplay').onclick = () => { if(!started) return begin(); voice.currentTime=0; if(voiceOn) play(voice); };

// 鍵盤、滑動
addEventListener('keydown', e=>{
  if(!started){ if(e.key==='Enter'||e.key===' ') begin(); return; }
  if(e.key==='ArrowRight'||e.key==='PageDown') next();
  else if(e.key==='ArrowLeft'||e.key==='PageUp') prev();
  else if(e.key===' '){ e.preventDefault(); voice.paused? play(voice) : voice.pause(); }
});
let x0=null;
stage.addEventListener('touchstart', e=>{ x0=e.touches[0].clientX },{passive:true});
stage.addEventListener('touchend', e=>{
  if(x0===null||!started) return; const dx=e.changedTouches[0].clientX-x0; x0=null;
  if(Math.abs(dx)>50){ dx<0? next() : prev(); }
});

sync();
const h = parseInt(location.hash.slice(1),10);
show(h>=1&&h<=TOTAL ? h-1 : 0);
</script>
</body>
</html>
